<?xml version="1.0" encoding="UTF-8"?>
<!--
  BossPilot 扩展图标源文件（金色火种 · Ember Compass）
  用于 32px 及以上尺寸；16px 请使用 icon-small.svg（简化变体）。
  设计语义：金色火种代表人的意图与判断，开放轨道代表 Agent、Skills 与工具协作。
  修改后运行 `npm run icons` 重新生成 public/icon/ 下的 PNG。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>BossPilot 金色火种应用图标</title>
  <defs>
    <linearGradient id="bg" x1="18" y1="8" x2="108" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#103a32"/>
      <stop offset="0.55" stop-color="#082a25"/>
      <stop offset="1" stop-color="#051b18"/>
    </linearGradient>
    <radialGradient id="field" cx="64" cy="66" r="59" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#275847" stop-opacity="0.58"/>
      <stop offset="0.55" stop-color="#0b3029" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#061d1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="upperRibbon" x1="19" y1="64" x2="109" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00a98f"/>
      <stop offset="0.52" stop-color="#19d7b4"/>
      <stop offset="1" stop-color="#72ffd3"/>
    </linearGradient>
    <linearGradient id="backRibbon" x1="16" y1="52" x2="49" y2="99" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18e2bd"/>
      <stop offset="1" stop-color="#007d70"/>
    </linearGradient>
    <linearGradient id="frontRibbon" x1="103" y1="47" x2="28" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#65ffd0"/>
      <stop offset="0.43" stop-color="#16d7b3"/>
      <stop offset="1" stop-color="#009885"/>
    </linearGradient>
    <radialGradient id="ember" cx="44%" cy="34%" r="69%">
      <stop offset="0" stop-color="#fff7b3"/>
      <stop offset="0.24" stop-color="#ffd84a"/>
      <stop offset="0.7" stop-color="#f4a51c"/>
      <stop offset="1" stop-color="#e56f10"/>
    </radialGradient>
    <filter id="emberGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#field)"/>

  <!-- 远端轨道：由左向右上方展开，像罗盘指针，也像正在生长的路径。 -->
  <path
    d="M18 65C19 47 41 37 66 30C85 25 100 19 111 10C105 31 93 40 70 47C47 53 31 59 26 72C21 70 18 68 18 65Z"
    fill="url(#upperRibbon)"
  />
  <path
    d="M26 49C13 61 13 79 25 89C32 95 41 98 50 98C47 91 42 86 34 82C23 76 19 64 26 49Z"
    fill="url(#backRibbon)"
  />

  <!-- 前景轨道保留右上缺口：所有有后果的行动最终回到人的判断。 -->
  <path
    d="M96 42C113 50 119 66 112 81C103 100 74 112 45 114C28 115 19 109 20 100C21 89 34 80 52 77C38 84 31 91 34 96C39 103 62 99 82 88C103 77 109 59 96 42Z"
    fill="url(#frontRibbon)"
  />
  <path
    d="M103 51C112 61 111 75 103 85C94 96 78 103 61 108"
    fill="none"
    stroke="#a0ffe0"
    stroke-width="2.4"
    stroke-linecap="round"
    opacity="0.42"
  />

  <!-- 人的意图是系统中心的火种。 -->
  <circle cx="64" cy="66" r="22" fill="#f4a51c" opacity="0.27" filter="url(#emberGlow)"/>
  <circle cx="64" cy="66" r="13.5" fill="url(#ember)"/>
  <circle cx="60" cy="61" r="3.2" fill="#fffbe0" opacity="0.72"/>
</svg>
